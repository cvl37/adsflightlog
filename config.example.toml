# adsflightlog configuration
# Copy to config.toml and adjust. config.toml is git-ignored.

[receiver]
# Receiver location in decimal degrees. Distances are measured from here.
# If omitted, it is read from readsb's receiver.json (receiver_json below).
# lat = 52.0000
# lon = 5.0000
aircraft_json = "/run/readsb/aircraft.json"
receiver_json = "/run/readsb/receiver.json"

[collect]
# Ignore positions older than this (seconds) — avoids counting stale tracks.
max_position_age_s = 15
# Poll interval for aircraft.json (seconds).
poll_interval_s = 5
# A new "sighting" of an already-caught airframe starts after this gap (minutes).
sighting_gap_min = 20

# Catch zones: an aircraft counts if it is inside ANY zone (once, even if it is
# inside several). Each zone is a circle around the receiver, optionally cut to
# a sector between two true bearings (clockwise from bearing_from to bearing_to,
# so 330 -> 30 is a slice across north) and optionally limited to aircraft below
# max_altitude_ft. Aircraft with unknown altitude never count in a zone that has
# an altitude limit.

[[collect.zone]]
name = "overhead"
max_distance_km = 25.0

# Example of a sector zone ("pizza slice"): 40 km, from south-east (135)
# clockwise to south-west (225), only below 10,000 ft.
# [[collect.zone]]
# name = "southern approach"
# max_distance_km = 40.0
# bearing_from = 135
# bearing_to = 225
# max_altitude_ft = 10000

[storage]
database = "data/adsflightlog.db"
# Type and operator names are read from tar1090's local database.
tar1090_db_dir = "/usr/local/share/tar1090/git-db/db"
# Registrations/types per airframe: the latest tar1090-db (Mictronics) release is
# downloaded here and refreshed every `refresh_days`. The copy bundled with tar1090
# only updates when tar1090 is reinstalled, so newer aircraft would be missing.
# Set aircraft_csv_url = "" to use tar1090's local copy only.
aircraft_csv_url = "https://github.com/wiedehopf/tar1090-db/raw/refs/heads/csv/aircraft.csv.gz"
aircraft_csv = "data/aircraft.csv.gz"
refresh_days = 7

[web]
host = "0.0.0.0"
port = 8642
